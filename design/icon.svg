<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3B4CF0"/>
      <stop offset="0.55" stop-color="#2430B8"/>
      <stop offset="1" stop-color="#141B6E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7C8CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262A44"/>
      <stop offset="1" stop-color="#0F1224"/>
    </linearGradient>
    <linearGradient id="chipEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4FF"/>
      <stop offset="1" stop-color="#A9B1D6"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E7BFF"/>
      <stop offset="1" stop-color="#8FA2FF"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FC7AE"/>
      <stop offset="1" stop-color="#5CF0D4"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FF9B6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05082A" flood-opacity="0.55"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- faint circuit traces -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M100 300 H230 L270 340"/>
      <path d="M924 700 H800 L760 660"/>
      <path d="M330 924 V820 L370 780"/>
      <path d="M690 100 V200 L650 240"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- pins -->
  <g fill="url(#pin)">
    <g id="pinsTop">
      <rect x="350" y="236" width="30" height="72" rx="15"/>
      <rect x="418" y="236" width="30" height="72" rx="15"/>
      <rect x="486" y="236" width="30" height="72" rx="15"/>
      <rect x="554" y="236" width="30" height="72" rx="15"/>
      <rect x="622" y="236" width="30" height="72" rx="15"/>
    </g>
    <use href="#pinsTop" transform="translate(0 480)"/>
    <use href="#pinsTop" transform="rotate(90 512 512)"/>
    <use href="#pinsTop" transform="rotate(90 512 512) translate(0 480)"/>
  </g>

  <!-- chip -->
  <g filter="url(#chipShadow)">
    <rect x="282" y="282" width="460" height="460" rx="78" fill="url(#chip)"/>
  </g>
  <rect x="283.5" y="283.5" width="457" height="457" rx="76.5" fill="none" stroke="url(#chipEdge)" stroke-width="3"/>

  <!-- the fit ladder: weights (fixed) + KV cache (grows with context) against the GPU limit -->
  <clipPath id="b1"><rect x="352" y="378" width="176" height="52" rx="26"/></clipPath>
  <clipPath id="b2"><rect x="352" y="486" width="246" height="52" rx="26"/></clipPath>
  <clipPath id="b3"><rect x="352" y="594" width="320" height="52" rx="26"/></clipPath>
  <g clip-path="url(#b1)"><rect x="352" y="378" width="150" height="52" fill="url(#w)"/><rect x="505" y="378" width="200" height="52" fill="url(#k)"/></g>
  <g clip-path="url(#b2)"><rect x="352" y="486" width="150" height="52" fill="url(#w)"/><rect x="505" y="486" width="200" height="52" fill="url(#k)"/></g>
  <g clip-path="url(#b3)"><rect x="352" y="594" width="150" height="52" fill="url(#w)"/><rect x="505" y="594" width="118" height="52" fill="url(#k)"/><rect x="626" y="594" width="80" height="52" fill="url(#r)"/></g>
  <line x1="624" y1="346" x2="624" y2="678" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 26"/>
</svg>
