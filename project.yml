name: ModelFit
options:
  bundleIdPrefix: com.mohammadhadijavidi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  ModelFitCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ModelFitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadhadijavidi.ModelFitCore
        PRODUCT_NAME: ModelFitCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026 Mohammad Hadi Javidi"

  ModelFit:
    type: application
    platform: macOS
    sources:
      - path: Sources/ModelFit
      - path: Sources/Shared
    dependencies:
      - target: ModelFitCore
        embed: true
      - target: ModelFitQuickLook
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadhadijavidi.modelfit
        PRODUCT_NAME: ModelFit
        INFOPLIST_FILE: Sources/ModelFit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  ModelFitQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/ModelFitQuickLook
      - path: Sources/Shared
    dependencies:
      - target: ModelFitCore
        embed: false
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadhadijavidi.modelfit.quicklook
        PRODUCT_NAME: ModelFitQuickLook
        INFOPLIST_FILE: Sources/ModelFitQuickLook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ModelFitQuickLook/ModelFitQuickLook.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  ModelFitCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ModelFitCoreTests
    dependencies:
      - target: ModelFitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadhadijavidi.ModelFitCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ModelFit:
    build:
      targets:
        ModelFit: all
        ModelFitCoreTests: [test]
    test:
      config: Debug
      targets:
        - ModelFitCoreTests
    run:
      config: Debug
    archive:
      config: Release
  ModelFitCore:
    build:
      targets:
        ModelFitCore: all
        ModelFitCoreTests: [test]
    test:
      config: Debug
      targets:
        - ModelFitCoreTests
